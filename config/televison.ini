# Televison operator configuration
# Edit and restart, or use Save config in the status panel.
# CLI device indices override [decklink] when provided.

[decklink]
input_device = 0
output_device = 1

[udp]
bind_ip = 127.0.0.1
port = 6305
send_ip = 127.0.0.1
send_port = 6305
recv_delay_ms = 0
raw_output_path = udpOut/udp_raw.txt

[window]
width = 1600
height = 900
title = TV monitor

[graphic]
data_dir = data

[recording]
recordings_dir = /home/quidich/stype-hf-emulator/recordings/
